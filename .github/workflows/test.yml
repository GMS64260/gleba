name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Quatre jobs indépendants, chacun requis sur `main` : un lint en échec ne
# doit plus empêcher les tests et le typage de tourner (rouge du 2026-08-27
# au 2026-10-31 sans qu'aucun test ne s'exécute sur GitHub).
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/preparer

      - name: Lint gate tests
        run: npm run test:lint-gate

      - name: Lint quality gate
        run: npm run lint:ci -- --base "$LINT_BASE_SHA"
        env:
          # PR: compare aux lignes ajoutées depuis la branche cible.
          # Push: compare au commit précédant le push; la baseline protège aussi le total.
          LINT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/preparer

      - name: Run vitest
        run: npm test

  typage:
    name: typage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/preparer

      - name: Type check
        run: npx tsc --noEmit

  base-neuve:
    name: base-neuve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_PASSWORD: gleba_test
          POSTGRES_DB: gleba_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gleba_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/preparer

      - name: Validate fresh database bootstrap
        run: |
          npx prisma migrate deploy
          npx tsx prisma/seed.ts
          npx tsx scripts/verify-bootstrap.ts
        env:
          DATABASE_URL: "postgresql://postgres:gleba_test@localhost:5432/gleba_test"
          ADMIN_EMAIL: "admin@example.test"
          ADMIN_NAME: "Test Admin"
          ADMIN_PASSWORD: "ci-only-password"
