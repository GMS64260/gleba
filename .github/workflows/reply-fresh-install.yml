name: Reply to fresh install report

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reply-fresh-install.yml

permissions:
  contents: read
  issues: write

jobs:
  reply:
    if: github.repository == 'GMS64260/gleba'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the resolution
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- gleba-fresh-install-fix-20260728 -->"
            const issueNumber = 24
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            })

            if (comments.some((comment) => comment.body?.includes(marker))) {
              core.info("Resolution already published")
              return
            }

            const body = [
              marker,
              "Bonjour Julien,",
              "",
              "Merci pour le signalement et pour le diagnostic, qui était correct.",
              "",
              "Le correctif est maintenant publié sur `main` :",
              "",
              "- ajout d’une migration initiale avant `20250129000000_add_auth` ;",
              "- ajout des migrations de rattrapage pour les tables et colonnes autrefois absentes de l’historique SQL ;",
              "- correction d’une ancienne migration qui ne pouvait pas s’exécuter sur une base vide ;",
              "- validation automatique de `prisma migrate deploy`, du seed et des comptes bootstrap sur une base PostGIS vierge ;",
              "- comptes admin et démo créés actifs avec `email_verified = true`, donc utilisables sans serveur SMTP.",
              "",
              "La validation a couvert 172 migrations depuis une base vide, un second `migrate deploy` sans attente, le seed complet, la connexion du compte administrateur et une mise à niveau sur une copie isolée de la base historique. La CI est également verte.",
              "",
              "Le contournement avec `prisma db push --accept-data-loss` n’est donc plus nécessaire. `docker-entrypoint.sh` doit conserver `prisma migrate deploy`.",
              "",
              "Correctifs :",
              "- https://github.com/GMS64260/gleba/commit/894566264095031f27c20322bcf38de20ecb0ea8",
              "- https://github.com/GMS64260/gleba/commit/cb3c9fccd375121ae335500d324fa0fc682d3eb4",
              "",
              "Si vous pouvez retester sur une instance vierge, votre retour est bienvenu.",
            ].join("\n")

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            })
