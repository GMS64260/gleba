services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: gleba_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gleba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gleba}
      POSTGRES_DB: ${POSTGRES_DB:-gleba}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gleba}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Activé via .env privé du serveur ; défaut "false" (build open-source).
        NEXT_PUBLIC_FEATURE_BOUTIQUE: ${NEXT_PUBLIC_FEATURE_BOUTIQUE:-false}
    container_name: gleba_app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gleba}:${POSTGRES_PASSWORD:-gleba}@db:5432/${POSTGRES_DB:-gleba}?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-changez-moi-en-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      # Facultatif : lecture Stripe par clé restreinte ou connexion OAuth.
      # Les accès propres à chaque ferme sont chiffrés en base.
      STRIPE_TOKEN_ENCRYPTION_KEY: ${STRIPE_TOKEN_ENCRYPTION_KEY:-}
      STRIPE_CONNECT_CLIENT_ID: ${STRIPE_CONNECT_CLIENT_ID:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_SYNC_ENABLED: ${STRIPE_SYNC_ENABLED:-true}
      # Connexion Google (optionnelle) : le bouton n'apparaît que si le client
      # OAuth est renseigné dans le .env privé du serveur.
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gleba.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      ADMIN_NAME: ${ADMIN_NAME:-Administrateur}
      # Modes « Normal », « Extra » et « Support » : agents Paperclip dédiés.
      # Les clés restent uniquement dans le .env privé du serveur.
      GLEBA_PAPERCLIP_API_URL: ${GLEBA_PAPERCLIP_API_URL:-}
      GLEBA_PAPERCLIP_COMPANY_ID: ${GLEBA_PAPERCLIP_COMPANY_ID:-}
      GLEBA_PAPERCLIP_NORMAL_AGENT_ID: ${GLEBA_PAPERCLIP_NORMAL_AGENT_ID:-}
      GLEBA_PAPERCLIP_NORMAL_AGENT_KEY: ${GLEBA_PAPERCLIP_NORMAL_AGENT_KEY:-}
      GLEBA_PAPERCLIP_ADVANCED_AGENT_ID: ${GLEBA_PAPERCLIP_ADVANCED_AGENT_ID:-}
      GLEBA_PAPERCLIP_ADVANCED_AGENT_KEY: ${GLEBA_PAPERCLIP_ADVANCED_AGENT_KEY:-}
      GLEBA_PAPERCLIP_SUPPORT_AGENT_ID: ${GLEBA_PAPERCLIP_SUPPORT_AGENT_ID:-}
      GLEBA_PAPERCLIP_SUPPORT_AGENT_KEY: ${GLEBA_PAPERCLIP_SUPPORT_AGENT_KEY:-}
      GLEBA_PAPERCLIP_SUPPORT_TICKET_ASSIGNEE_ID: ${GLEBA_PAPERCLIP_SUPPORT_TICKET_ASSIGNEE_ID:-}
      # Lot assistant 2026-08-11 : cadence de sondage Paperclip (ms) et
      # kill-switch des réponses directes sans LLM ("off" pour couper).
      GLEBA_PAPERCLIP_POLL_MS: ${GLEBA_PAPERCLIP_POLL_MS:-}
      GLEBA_REPONSES_DIRECTES: ${GLEBA_REPONSES_DIRECTES:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FEEDBACK_EMAIL: ${FEEDBACK_EMAIL:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Notifications métier par email (cron interne : résumé + alertes temps réel)
      NOTIF_ENABLED: ${NOTIF_ENABLED:-true}
      NOTIF_RESUME_HEURE: ${NOTIF_RESUME_HEURE:-07:00}
      NOTIF_METEO_INTERVAL_MIN: ${NOTIF_METEO_INTERVAL_MIN:-30}
      # Audit compta 2026-06 : les bornes d'exercice comptable sont calculées
      # en heure locale du serveur — en UTC, une vente saisie le 1er janvier
      # 00h30 (heure de Paris) tombait dans l'exercice précédent.
      TZ: ${TZ:-Europe/Paris}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persiste les fichiers téléversés (logos, bannières, photos produits,
      # justificatifs…) entre les rebuilds du conteneur.
      - uploads_data:/app/public/uploads
      # Les justificatifs comptables sont séparés de la racine publique et
      # servis uniquement par une route authentifiée avec contrôle propriétaire.
      - justificatifs_data:/app/storage/justificatifs
      # Images de fond du plan 2D (satellite/drone), même modèle que les
      # justificatifs : hors racine publique, route authentifiée propriétaire.
      - plan_fonds_data:/app/storage/plan-fonds
      # Archives immuables des registres d'élevage complets (PDF, manifeste et
      # annexes), servies uniquement après contrôle du propriétaire et du hash.
      - registres_elevage_data:/app/storage/registres

volumes:
  postgres_data:
  uploads_data:
  justificatifs_data:
  plan_fonds_data:
  registres_elevage_data:
